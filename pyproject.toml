[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oric"
version = "1.3.0"
description = "Cumulative Symbolic Threshold — A falsifiable protocol for O·R·I dynamics"
readme = "README.md"
license = {text = "MIT"}
# Python policy: 3.12 ONLY (single canonical interpreter).
# This is the version pinned across every workflow, the Docker image,
# environment.yml, ruff (target-version) and mypy (python_version).
# See docs/PYTHON_POLICY.md. Changing this requires updating all of them.
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Didier Daloze", email = "contact@ori-c.be"}
]
keywords = [
    "symbolic-threshold", "viability", "phase-transition",
    "falsifiable", "ORI-C", "cumulative-regime", "dissipative-systems"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.12 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.5",
]
notebooks = [
    "jupyter>=1.0",
    "jupyterlab>=4.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=1.0.3",
]
all = ["oric[dev,notebooks,docs]"]

[project.scripts]
oric-run-all = "oric._entrypoints:run_all"
oric-run-tests = "oric._entrypoints:run_all_tests"
oric-cap-robustness = "oric.cap_robustness:main"

[project.urls]
Homepage = "https://www.ori-c.be"
Repository = "https://github.com/dalozedidier-dot/CumulativeSymbolicThreshold"
Documentation = "https://www.ori-c.be/ori-c-recherche.html"
"OSF Pre-registration" = "https://osf.io/g62pz/"
"Bug Tracker" = "https://github.com/dalozedidier-dot/CumulativeSymbolicThreshold/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oric = ["py.typed"]

# ── Ruff (replaces flake8 + black + isort) ─────────────
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".claude/worktrees", ".venv", "venv", ".venv_*"]

[tool.ruff.lint]
# Explicit rule surface — do NOT rely on Ruff's implicit default selection.
#   Ruff's *default* rule set is not stable across releases: 0.16 widened it and
#   turned a green pipeline red on ~1000 pre-existing findings, none of which
#   were introduced by a code change. Same reasoning as constraints.txt: what CI
#   enforces must be a function of this file, not of whichever Ruff resolved on
#   PyPI that morning. Widening this list is a deliberate, reviewable act.
select = [
    "E4",   # pycodestyle — import placement
    "E7",   # pycodestyle — statement-level errors
    "E9",   # pycodestyle — syntax / IO errors
    "F",    # pyflakes — undefined names, unused imports, dead code
    "I",    # isort — import ordering (Ruff replaces isort here)
]
# `extend-ignore` was removed in Ruff 0.16 and was being silently dropped.
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"src/oric/__init__.py" = ["F401", "F403"]
"04_Code/tests/*.py" = ["E402"]          # sys.path manipulation before imports
"src/oric/tests/*.py" = ["E402"]         # sectioned imports in coverage test files
"04_Code/tests/test_did_sc.py" = ["E501"]
"04_Code/tests/test_oos_panel.py" = ["E741"]
"04_Code/tests/test_e2e_pipeline.py" = ["E501"]
"04_Code/pipeline/*.py" = ["E402", "E741"]
"04_Code/sector/**/*.py" = ["E402", "E741"]
"06_Manuscript/figures/*.py" = ["E402", "E741"]
"scripts/*.py" = ["E402", "E741"]
"tools/qcc/*.py" = ["E741"]
"examples/*.ipynb" = ["E402", "E702"]

# ── Type checking ───────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false     # progressive — set true later

# ── Testing ─────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["src/oric/tests", "04_Code/tests", "tools"]
addopts = "-q --tb=short"
# Test tiers — see docs/TESTING.md.  `make test-smoke|test-full|test-scientific`.
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "smoke: minimal fast confidence check (imports + core pipeline). Run with -m smoke",
    "scientific: heavy statistical proofs (N>=50, surrogates, multiverse, OOS). Run with -m scientific",
    "stored_artifact: anti-drift checks against the committed evidence artifacts under 05_Results/. Run by default; opt out with --no-stored-artifact-tests",
]

# ── Coverage ────────────────────────────────────────────
[tool.coverage.run]
source = ["src/oric"]
branch = true
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
show_missing = true
