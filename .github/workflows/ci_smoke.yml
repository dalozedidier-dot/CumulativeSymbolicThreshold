name: CI Smoke — Tests + Canonical Fast

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  # Shared dependency-version ceiling for every pip install in this workflow.
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt

jobs:
  compileall:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Python syntax (compileall)
        run: python -m compileall 04_Code -q
      - name: Guard against case-insensitive path collisions
        run: python -m tools.check_case_collisions
      - name: Verify frozen data pack (hashes) + manifest is current
        run: |
          python -m tools.verify_data_pack
          python -m tools.build_data_pack_manifest --check
      - name: Repository doctor
        run: python tools/repo_doctor.py

  lint_typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy pandas-stubs scipy-stubs
          python -m pip install -e ".[dev]" || python -m pip install -e .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy type check
        run: python -m mypy src/oric

  # ── Smoke tier: fastest signal, fail-fast before the full gate ──────────────
  smoke:
    needs: compileall
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then python -m pip install -e ".[dev]"; fi
      - name: Run smoke tier (-m smoke)
        run: pytest -q -m smoke src/oric/tests 04_Code/tests

  unit_tests:
    # The full coverage gate runs the WHOLE suite (smoke + full + scientific),
    # so tiering never lowers measured coverage. See docs/TESTING.md.
    needs: [compileall, lint_typecheck, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Python policy: 3.12 ONLY — see docs/PYTHON_POLICY.md
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install             "numpy>=1.26"             "pandas>=2.0"             "scipy>=1.11"             "statsmodels>=0.14"             "matplotlib>=3.8"             "pytest>=8.0"             "pytest-cov>=4.1"

          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f 04_Code/requirements.txt ]; then python -m pip install -r 04_Code/requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then python -m pip install -e .; fi
      - name: Run pytest with coverage
        run: pytest -q --cov=src/oric --cov-branch --cov-report=xml --cov-report=term-missing src/oric/tests 04_Code/tests tools/tests 2>&1
      - name: Check coverage threshold
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.attrib.get('line-rate', 0))
          branch_rate = float(root.attrib.get('branch-rate', 0))
          line_pct = line_rate * 100
          branch_pct = branch_rate * 100
          print(f'Line coverage: {line_pct:.1f}%')
          print(f'Branch coverage: {branch_pct:.1f}%')
          if line_pct < 95:
              print(f'FAIL: line coverage {line_pct:.1f}% < 95%')
              exit(1)
          print('OK: line coverage threshold met')
          "
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: coverage.xml
          fail_ci_if_error: false
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python-version }}-${{ github.run_id }}
          path: coverage.xml
          if-no-files-found: warn

  canonical_suite:
    needs: unit_tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clean CI output directory
        run: |
          rm -rf _ci_out
          mkdir -p _ci_out

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install             "numpy>=1.26"             "pandas>=2.0"             "matplotlib>=3.8"             "scipy>=1.11"             "statsmodels>=0.14"             "pytest>=8.0"

          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt;           elif [ -f 04_Code/requirements.txt ]; then python -m pip install -r 04_Code/requirements.txt; fi

          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then python -m pip install -e .; fi

      - name: Log environment
        run: |
          python -V | tee _ci_out/python_version.txt
          pip list | tee _ci_out/pip_list.txt

      - name: Run canonical suite (smoke_ci - fast mode)
        run: |
          set -eo pipefail
          PYTHONPATH=src python 04_Code/pipeline/run_all_tests.py             --outdir _ci_out/canonical_tests             --fast             2>&1 | tee _ci_out/run_all_tests.log

          if [ -d 05_Results ]; then cp -R 05_Results _ci_out/05_Results; fi

      - name: Run Cap(t) robustness gate
        run: |
          set -euo pipefail
          mkdir -p _ci_out/cap_robustness
          PYTHONPATH=src python -m oric.cap_robustness \
            --input 03_Data/synthetic/synthetic_with_threshold.csv \
            --output _ci_out/cap_robustness/cap_robustness_report.json \
            2>&1 | tee _ci_out/cap_robustness/cap_robustness.log
          python - <<'PYEOF'
          import json
          from pathlib import Path

          report_path = Path("_ci_out/cap_robustness/cap_robustness_report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          spec = report.get("spec", {})
          forms = ", ".join(spec.get("forms", []))
          md = [
              "# Cap(t) robustness gate",
              "",
              f"- verdict: `{report.get('verdict', 'UNKNOWN')}`",
              f"- stable_across_specs: `{report.get('stable_across_specs', 'UNKNOWN')}`",
              f"- primary_form: `{report.get('primary_form', 'UNKNOWN')}`",
              f"- tested_forms: `{forms}`",
              "",
              "This gate is diagnostic in smoke CI. A CAP_SPEC_SENSITIVE result is a visible scientific finding, not a technical failure.",
          ]
          Path("_ci_out/cap_robustness/cap_robustness_summary.md").write_text("\n".join(md) + "\n", encoding="utf-8")
          print("\n".join(md))
          PYEOF

      - name: Build registered report assets (figures + tables)
        run: |
          set -e
          RUN_DIR=$(ls -1d _ci_out/canonical_tests/* 2>/dev/null | sort | tail -n 1)
          if [ -z "$RUN_DIR" ]; then
            echo "ERROR: no run directory found under _ci_out/canonical_tests"
            exit 1
          fi
          echo "Using RUN_DIR=$RUN_DIR"
          python 04_Code/reporting/build_registered_report_assets.py --run-dir "$RUN_DIR"

          mkdir -p _ci_out/06_Manuscript
          if [ -d 06_Manuscript ]; then cp -R 06_Manuscript _ci_out/06_Manuscript; fi

      - name: Assert smoke CI contract (hard gate)
        run: |
          python - <<'PYEOF'
          import glob
          import json
          import os
          import sys

          candidates = glob.glob("_ci_out/canonical_tests/**/global_verdict.json", recursive=True)
          if not candidates:
              candidates = glob.glob("_ci_out/**/global_verdict.json", recursive=True)

          if not candidates:
              print("ERROR: global_verdict.json not found")
              sys.exit(1)

          verdict_file = max(candidates, key=os.path.getmtime)
          d = json.loads(open(verdict_file, encoding="utf-8").read())

          run_mode = d.get("run_mode", "UNKNOWN")
          support_level = d.get("support_level", "UNKNOWN")

          if run_mode == "smoke_ci" and support_level == "full_statistical_support":
              print(f"ERROR: smoke_ci cannot claim full_statistical_support. verdict_file={verdict_file}")
              sys.exit(1)

          ok = (run_mode == "smoke_ci" and support_level in ("smoke_ci_accept","rejected","inconclusive")) or (run_mode != "smoke_ci")
          if not ok:
              print(f"ERROR: invalid support_level={support_level} for run_mode={run_mode}. verdict_file={verdict_file}")
              sys.exit(1)

          print(f"OK contract: run_mode={run_mode} support_level={support_level} verdict_file={verdict_file}")
          PYEOF

      - name: Build CI summary (json + md + Actions summary)
        run: |
          set -e
          python 04_Code/reporting/build_ci_summary.py --ci-out _ci_out --canonical-root _ci_out/canonical_tests

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ci_canonical_${{ github.run_id }}
          path: _ci_out
          if-no-files-found: warn
